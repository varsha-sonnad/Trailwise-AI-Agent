
services:
  mongodb:
    image: mongo:7
    container_name: trailwise-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: trailwise
      MONGO_INITDB_ROOT_PASSWORD: trailwise123
      MONGO_INITDB_DATABASE: trailwise
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    container_name: trailwise-redis
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    container_name: trailwise-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  # The Trailwise backend. It also runs the STDIO MCP server as a subprocess, in the same container.
  # The real .env is mounted read-only at /app/.env, the spot both config files already read,
  # so the API keys reach the backend and the MCP subprocess without being copied into the image.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: trailwise-backend
    ports:
      - "8000:8000"
    volumes:
      - ./.env:/app/.env:ro

volumes:
  mongo_data:
