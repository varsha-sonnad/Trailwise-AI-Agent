
services:
  redis:
    image: redis:7
    container_name: trailwise-redis
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    container_name: trailwise-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  # Keycloak: sign-up, login, passwords and tokens (OpenID Connect). Dev mode, local testing only.
  # The "trailwise" realm and the "trailwise-web" client are imported from keycloak/trailwise-realm.json on
  # first start. The admin password comes from KEYCLOAK_ADMIN_PASSWORD in the project-root .env (compose reads
  # it automatically); with no password Keycloak refuses to start, the other services are not affected.
  # Admin console: http://localhost:8080. Data lives in the keycloak_data volume (Keycloak's own embedded store;
  # a real deployment needs a supported database for it).
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: trailwise-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      # The address the browser uses; it ends up in every token as the issuer.
      KC_HOSTNAME: http://localhost:8080
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/trailwise-realm.json:/opt/keycloak/data/import/trailwise-realm.json:ro
      # The Trailwise login theme (sunset page, rounded card, orange buttons). Choose it in the admin console:
      # Realm settings > Themes > Login theme > trailwise. Dev mode re-reads theme files, no restart needed.
      - ./keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      - mailpit

  # The Trailwise backend. It also runs the STDIO MCP server as a subprocess, in the same container.
  # The real .env is mounted read-only at /app/.env, the spot both config files already read,
  # so the API keys reach the backend and the MCP subprocess without being copied into the image.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: trailwise-backend
    ports:
      - "8000:8000"
    volumes:
      - ./.env:/app/.env:ro
      # The audit log: shared with your machine (backend/logs/audit.log), so you can read it there and it survives
      # rebuilds. Without this line the log lives only inside the container and is lost when it is recreated.
      - ./backend/logs:/app/backend/logs
    environment:
      # Inside Docker the backend reaches Keycloak by its service name to fetch the public keys.
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080

  # The Trailwise frontend: the React app built once and served by nginx (non-root, port 8080 inside).
  # Open http://localhost:5173, the one address the backend's CORS allows. Your browser calls the backend
  # directly at VITE_API_URL (the port published above); that value is baked in at build time, so changing
  # it needs: docker compose build frontend. Do not run "npm run dev" at the same time: both use port 5173.
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
        # The map tiles (OpenStreetMap's public server is for light use; put your own provider's address here if you have one).
        VITE_MAP_TILE_URL: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
        # Non-secret Keycloak settings the browser needs (baked in at build time).
        VITE_KEYCLOAK_URL: http://localhost:8080
        VITE_KEYCLOAK_REALM: trailwise
        VITE_KEYCLOAK_CLIENT_ID: trailwise-web
    container_name: trailwise-frontend
    ports:
      - "5173:8080"
    depends_on:
      - backend

volumes:
  keycloak_data:
