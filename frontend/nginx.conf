# nginx.conf: the web server settings for the frontend container (copied over the image's default site).
# It is the image's default server (port 8080, same root, same index files, same 50x error page) with ONE change:
# any path that is not a real file, such as /app, falls back to index.html, so the React app can show that page.
# Without this, opening or reloading http://localhost:5173/app in Docker would be a 404.
# The image's default sets no custom response headers, so there are none to keep.

server {
    listen       8080;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # Serve the file or folder if it exists, otherwise hand the request to the React app.
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
