<!doctype html>
<!--
  index.html: the entry page of the Trailwise React app (built with Vite).
  It only holds an empty <div id="root">; src/main.jsx mounts the React app into it.
  Run it from this folder with: npm install, then npm run dev, then open http://localhost:5173
  (the backend only allows requests from http://localhost:5173, so use that exact address).
  This page holds no API keys: the app only talks to the backend.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Trailwise</title>
</head>
<body>
  <!-- The React app is rendered here. -->
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
