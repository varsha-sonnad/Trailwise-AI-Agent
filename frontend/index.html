<!doctype html>
<!--
  index.html: the Trailwise chat page. One file, no build step.
  It sends the user's message to the backend (POST /chat) and shows the reply.
  Serve it from this folder with: python -m http.server 5173, then open http://localhost:5173
  (the backend only allows requests from http://localhost:5173, so use that exact address).
  This page holds no API keys: it only talks to the backend.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trailwise</title>
  <style>
    /* Colors are defined once here; dark mode overrides them below. */
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #667085;
      --border: #dfe3e8; --accent: #0f766e; --accent-text: #ffffff;
      --user-bg: #0f766e; --user-text: #ffffff; --bot-bg: #eef1f4; --error: #b42318;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101418; --panel: #181d23; --text: #e8eaed; --muted: #98a2b3;
        --border: #2a313a; --accent: #2dd4bf; --accent-text: #08201d;
        --user-bg: #14675f; --user-text: #ffffff; --bot-bg: #222a33; --error: #fda29b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      height: 100dvh; display: flex; justify-content: center;
    }
    /* The chat column: header, message list, input row. */
    .app {
      width: 100%; max-width: 760px; display: flex; flex-direction: column;
      background: var(--panel); border-left: 1px solid var(--border); border-right: 1px solid var(--border);
    }
    header { padding: 14px 16px; border-bottom: 1px solid var(--border); }
    header h1 { margin: 0; font-size: 18px; }
    header p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg {
      max-width: 85%; padding: 10px 14px; border-radius: 14px;
      white-space: pre-wrap; overflow-wrap: anywhere; /* keep line breaks from the reply */
    }
    .user { align-self: flex-end; background: var(--user-bg); color: var(--user-text); }
    .bot { align-self: flex-start; background: var(--bot-bg); }
    .error { align-self: flex-start; background: transparent; color: var(--error); border: 1px solid var(--error); }
    .pending { color: var(--muted); font-style: italic; }
    form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
    textarea {
      flex: 1; resize: none; padding: 10px 12px; border-radius: 10px; font: inherit;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
    }
    textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button {
      padding: 0 20px; border: 0; border-radius: 10px; font: inherit; font-weight: 600; cursor: pointer;
      background: var(--accent); color: var(--accent-text);
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .hint { padding: 0 16px 10px; font-size: 12px; color: var(--muted); }
    @media (max-width: 600px) { .app { border: 0; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>Trailwise</h1>
      <p>Your AI travel planner. Planning and information only: no booking or payments.</p>
    </header>

    <!-- Conversation is added here by the script below. -->
    <div id="messages" aria-live="polite"></div>

    <form id="chat-form">
      <textarea id="input" rows="2" placeholder="e.g. Plan a 3-day trip to Goa from Bangalore" aria-label="Your message"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
    <div class="hint">Enter to send, Shift+Enter for a new line. Transport details are indicative only: verify before travel.</div>
  </main>

  <script>
    // Where the backend is running. Change this if you run it on another address.
    const API_URL = "http://localhost:8000/chat";
    // Longest message the backend accepts (matches max_message_chars in backend/app/config.py).
    const MAX_CHARS = 1000;

    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    // Add one bubble to the conversation and scroll to it. textContent (not innerHTML) keeps
    // reply text from being treated as HTML.
    function addMessage(text, kind) {
      const el = document.createElement("div");
      el.className = "msg " + kind;
      el.textContent = text;
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return el;
    }

    // Turn a failed HTTP response into a short message the user can understand.
    function describeError(status) {
      if (status === 422) return "That message was not accepted. Keep it between 1 and " + MAX_CHARS + " characters.";
      if (status === 502) return "The assistant is unavailable right now. Please try again.";
      return "Something went wrong (error " + status + "). Please try again.";
    }

    // Send the message to the backend and show the reply (or an error).
    async function send(message) {
      addMessage(message, "user");
      const pending = addMessage("Thinking...", "bot pending");
      sendBtn.disabled = true; // block double sends while waiting
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message }),
        });
        if (!res.ok) throw new Error(describeError(res.status));
        const data = await res.json();
        pending.className = "msg bot";
        pending.textContent = data.reply;
      } catch (err) {
        pending.className = "msg error";
        // fetch throws a TypeError when the server cannot be reached at all.
        pending.textContent = err instanceof TypeError
          ? "Cannot reach the server. Is the backend running on " + API_URL + "?"
          : err.message;
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    // Handle the Send button.
    form.addEventListener("submit", (event) => {
      event.preventDefault(); // stop the page from reloading
      const message = input.value.trim();
      if (!message) return;
      if (message.length > MAX_CHARS) {
        addMessage("Please keep your message under " + MAX_CHARS + " characters.", "error");
        return;
      }
      input.value = "";
      send(message);
    });

    // Enter sends; Shift+Enter inserts a new line.
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    // Greet the user when the page opens.
    addMessage("Hi! Tell me where you want to go and I will help you plan it.", "bot");
    input.focus();
  </script>
</body>
</html>
