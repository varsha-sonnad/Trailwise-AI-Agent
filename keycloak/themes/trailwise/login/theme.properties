# theme.properties: the Trailwise login theme. It builds on Keycloak's own "keycloak.v2" login theme
# (so every page, form and script keeps working) and only adds one stylesheet on top.
# Activate it in the Keycloak admin console: Realm settings > Themes > Login theme > trailwise.
parent=keycloak.v2
# Keep the parent's stylesheet, then ours (css/trailwise.css in this theme's resources folder).
styles=css/styles.css css/trailwise.css
